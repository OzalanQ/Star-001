<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starwarts - 魔法装备游戏</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap');
        body{font-family:'Cinzel',serif;background:linear-gradient(135deg,#0c0c2e 0%,#1a1a4e 50%,#2d1b69 100%);min-height:100vh;overflow-x:hidden}.starfield{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}.star{position:absolute;background:white;border-radius:50%;animation:twinkle 2s infinite}@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}.magic-border{background:linear-gradient(45deg,#4f46e5,#7c3aed,#ec4899,#4f46e5);background-size:400% 400%;animation:gradientShift 3s ease infinite;border-radius:12px;padding:2px}@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}.magic-card{background:rgba(30,30,80,.9);backdrop-filter:blur(10px);border:1px solid rgba(147,51,234,.3)}.character-avatar{width:200px;height:250px;background-size:cover;background-position:center;border-radius:10px;transition:all .3s ease;display:flex;align-items:center;justify-content:center;margin:0 auto;border:3px solid rgba(147,51,234,.5)}.character-avatar-default-bg{background:linear-gradient(135deg,#5b21b6 0%,#1e3a8a 100%)}.inventory-slot{width:70px;height:80px;border:2px dashed rgba(147,51,234,.5);border-radius:8px;display:flex;align-items:center;justify-content:center;transition:all .3s ease;position:relative}.inventory-slot.filled{border-style:solid;background:rgba(147,51,234,.2);padding:2px}.text-xxs{font-size:.65rem;line-height:.85rem}.modal-overlay{background:rgba(0,0,0,.8);backdrop-filter:blur(5px)}.floating{animation:floating 3s ease-in-out infinite}@keyframes floating{0%,100%{transform:translateY(0px)}50%{transform:translateY(-10px)}}.nav-button{transition:all .3s ease}.nav-button.active{background-color:#ec4899;box-shadow:0 0 15px #ec4899}.arena-card{border:2px solid rgba(147,51,234,.5);background:rgba(20,20,60,.8)}.confetti-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}.confetti{position:absolute;width:10px;height:10px;background-color:#f00;opacity:0;animation:fall 3s ease-in-out forwards}@keyframes fall{0%{transform:translateY(-100px) rotateZ(0deg);opacity:1}100%{transform:translateY(100vh) rotateZ(720deg);opacity:0}}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
    </style>
</head>
<body>
    <div class="starfield" id="starfield"></div>
    <div id="loginRegisterModal" class="fixed inset-0 z-50 modal-overlay flex items-center justify-center">
        <div class="magic-border"><div id="loginBox" class="magic-card p-8 rounded-lg text-center w-96"><h1 id="modalTitle" class="text-4xl font-bold text-purple-300 mb-4 floating">✨ Starwarts ⚡</h1><p id="modalSubtitle" class="text-gray-300 mb-6">登录或注册账号</p><div id="loginError" class="text-red-400 mb-2 hidden"></div><input type="text" id="usernameInput" autocomplete="username" class="w-full px-4 py-3 bg-gray-800 text-white rounded-lg border border-purple-500 mb-4" placeholder="输入账号..."><input type="text" id="regCharNameInput" maxlength="20" class="w-full px-4 py-3 bg-gray-800 text-white rounded-lg border border-purple-500 mb-4 hidden" placeholder="角色名（可选，之后也能改）..."><input type="password" id="passwordInput" class="w-full px-4 py-3 bg-gray-800 text-white rounded-lg border border-purple-500 mb-4" placeholder="输入密码..."><input type="password" id="confirmPasswordInput" class="w-full px-4 py-3 bg-gray-800 text-white rounded-lg border border-purple-500 mb-4 hidden" placeholder="确认密码..."><div id="initialButtons" class="flex space-x-4"><button onclick="login()" class="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white py-3 rounded-lg">登录</button><button id="registerButton" onclick="showRegisterForm()" class="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white py-3 rounded-lg">注册</button></div><div id="registerButtons" class="flex space-x-4 hidden"><button onclick="register()" class="w-full bg-gradient-to-r from-green-500 to-blue-500 text-white py-3 rounded-lg">确认注册</button><button onclick="hideRegisterForm()" class="w-full bg-gray-600 text-white py-3 rounded-lg">返回登录</button></div></div></div>
    </div>
    <div id="mainContainer" class="hidden min-h-screen p-4"></div>
    <div id="characterCustomizationModal" class="fixed inset-0 z-50 modal-overlay items-center justify-center hidden"><div class="magic-border"><div class="magic-card p-6 rounded-lg w-96"><h3 class="text-xl font-bold text-purple-300 mb-4">自定义你的角色</h3><div class="space-y-4"><div><label for="customNameInput" class="block text-sm font-medium text-gray-300 mb-1">角色名称</label><input type="text" id="customNameInput" placeholder="输入你的角色名" class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-purple-500"></div><div><label for="customAvatarUrlInput" class="block text-sm font-medium text-gray-300 mb-1">头像URL</label><input type="url" id="customAvatarUrlInput" placeholder="输入图片网络地址" class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-purple-500"></div><div><label for="customAvatarFileInput" class="block text-sm font-medium text-gray-300 mb-1">或上传本地图片</label><input type="file" id="customAvatarFileInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700"></div><div class="flex space-x-3 pt-2"><button onclick="saveCustomization()" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded">保存</button><button type="button" onclick="closeCustomizationModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded">取消</button></div></div></div></div></div>
    <div id="listItemModal" class="fixed inset-0 z-50 modal-overlay items-center justify-center hidden"><div class="magic-border"><div class="magic-card p-6 rounded-lg w-96"><h3 class="text-xl font-bold text-purple-300 mb-4">上架仓库物品</h3><form id="listItemForm" class="space-y-4"><div><label for="listItemSelect" class="block text-sm font-medium text-gray-300 mb-1">选择要出售的物品</label><select id="listItemSelect" class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-purple-500" required></select><p class="text-xs text-gray-500 mt-1">只能出售自己仓库里的装备或卡牌。上架后物品会从仓库移出，下架时退回。</p></div><input type="number" id="itemPriceInput" min="1" max="100000" step="1" placeholder="售价（正整数）" class="w-full px-3 py-2 bg-gray-800 text-white rounded border border-purple-500" required><div class="flex space-x-3"><button type="submit" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-2 rounded">上架</button><button type="button" onclick="closeListItemModal()" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded">取消</button></div></form></div></div></div>
    
    <!-- 新增：战斗结果模态框 -->
    <div id="battleResultModal" class="fixed inset-0 z-50 modal-overlay items-center justify-center hidden"><div class="magic-border"><div class="magic-card p-8 rounded-lg w-auto text-center relative"><div class="confetti-container" id="confettiContainer"></div><h2 id="battleResultText" class="text-6xl font-bold mb-4">胜利!</h2><div id="battleResultWinnerAvatar" class="character-avatar my-4 mx-auto"></div><p class="text-2xl text-white">获胜者是 <span id="battleResultWinnerName" class="font-bold text-yellow-300"></span>!</p><p id="battleRewardText" class="text-green-400 mt-2 text-lg"></p><button onclick="closeBattleResultModal()" class="mt-6 bg-gray-600 hover:bg-gray-700 text-white py-2 px-6 rounded">关闭</button></div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===================== 配置：把下面两行换成你自己 Supabase 项目的值 =====================
        // 在 Supabase 控制台 → Project Settings → API Keys（或 Data API）里能找到
        const SUPABASE_URL = 'https://rxnaklyaiquqlmjymzkk.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_nb620Ckj_sCfdA_lE0yITg_3OSo6WQk';   // 只能填 publishable / anon 公开密钥，绝对不要填 secret / service_role

        const INVENTORY_SIZE = 30;
        const MAX_NAME_LENGTH = 20;
        const MAX_PRICE = 100000;
        const TOKEN_KEY = 'starwartsToken';

        const configReady = !SUPABASE_URL.includes('你的项目') && !SUPABASE_KEY.includes('你的');
        const sb = (configReady && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } }) : null;

        let gameState = {};
        let globalEquipmentStore = [];
        let globalMagicCardStore = [];
        let currentListings = [];

        // ===================== 安全工具 =====================
        function esc(value) {
            return String(value ?? '').replace(/[&<>"'`]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
        }
        // 只允许 http/https 图片地址，或网页压缩生成的小图片（data:image）
        function safeUrl(value) {
            if (!value) return '';
            const s = String(value);
            if (/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s)) return s;
            try { const url = new URL(s); if (url.protocol === 'http:' || url.protocol === 'https:') return url.href; } catch (e) { }
            return '';
        }
        function num(value) { const n = Number(value); return Number.isFinite(n) ? n : 0; }
        function imgTag(url, alt, cls) { const u = safeUrl(url); return u ? `<img src="${esc(u)}" alt="${esc(alt)}" class="${cls}">` : ''; }
        function setAvatar(el, url, fallbackIconHtml) {
            const u = safeUrl(url);
            if (u) { el.innerHTML = ''; el.style.backgroundImage = `url("${u.replace(/["\\\n\r]/g, encodeURIComponent)}")`; el.classList.remove('character-avatar-default-bg'); }
            else { el.style.backgroundImage = ''; el.innerHTML = fallbackIconHtml; el.classList.add('character-avatar-default-bg'); }
        }
        function sumStat(items, key) { return (items || []).reduce((s, item) => s + num(item && item[key]), 0); }
        function isEquipmentItem(item) { return !!item && Object.prototype.hasOwnProperty.call(item, 'attack') && Object.prototype.hasOwnProperty.call(item, 'defense'); }

        // ===================== 与 Supabase 通信 =====================
        // 所有操作都调用数据库里的 sw_ 函数；金币和物品全部由服务器计算
        async function rpc(fn, params = {}, needLogin = true) {
            if (!sb) throw new Error('网站还没有配置好 Supabase 地址和密钥，请联系老师');
            if (needLogin) params = { p_token: localStorage.getItem(TOKEN_KEY) || '', ...params };
            const { data, error } = await sb.rpc(fn, params);
            if (error) {
                const err = new Error(error.message || '请求失败');
                if (/登录已过期/.test(error.message || '')) err.sessionExpired = true;
                throw err;
            }
            return data;
        }
        function handleError(prefix, error) {
            console.error(prefix, error);
            if (error.sessionExpired) { alert('登录已过期，请重新登录。'); logout(true); return; }
            alert(`${prefix}: ${error.message}`);
        }
        // 执行一个会改变存档的操作，用服务器返回的新存档刷新界面
        async function act(fn, params, errorPrefix) {
            try {
                const data = await rpc(fn, params);
                if (data && data.gameState) gameState = data.gameState;
                renderAll();
                return data;
            } catch (error) { handleError(errorPrefix, error); return null; }
        }

        // ===================== 启动 =====================
        document.addEventListener('DOMContentLoaded', async function () {
            createStarfield();
            document.getElementById('loginRegisterModal').classList.remove('hidden');
            document.getElementById('passwordInput').addEventListener('keypress', function (e) {
                if (e.key !== 'Enter') return;
                const isLoginVisible = !document.getElementById('initialButtons').classList.contains('hidden');
                if (isLoginVisible) login(); else register();
            });
            if (!sb) { showMessage('loginError', configReady ? '无法加载 Supabase 组件，请检查网络后刷新。' : '网站还没有配置 Supabase 地址和密钥（见网页源代码开头的配置区）。'); return; }
            try {
                const settings = await rpc('sw_public_settings', {}, false);
                if (settings && settings.registrationOpen === false) document.getElementById('registerButton').classList.add('hidden');
            } catch (e) { console.warn('读取设置失败', e); }
            // 已登录过就自动进入
            if (localStorage.getItem(TOKEN_KEY)) {
                try { gameState = await rpc('sw_get_state'); await enterGame(); }
                catch (e) { localStorage.removeItem(TOKEN_KEY); }
            }
        });

        function createStarfield() {
            const starfield = document.getElementById('starfield');
            if (!starfield) return;
            starfield.innerHTML = '';
            for (let i = 0; i < 100; i++) { const star = document.createElement('div'); star.className = 'star'; star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%'; star.style.width = Math.random() * 3 + 1 + 'px'; star.style.height = star.style.width; star.style.animationDelay = Math.random() * 2 + 's'; starfield.appendChild(star); }
        }
        function showMessage(elementId, message, isError = true) {
            const div = document.getElementById(elementId);
            div.textContent = message;
            div.className = isError ? 'text-red-400 mb-2' : 'text-green-400 mb-2';
            div.classList.remove('hidden');
        }

        // ===================== 账号 =====================
        function showRegisterForm() { document.getElementById('modalTitle').textContent = '创建新账号'; document.getElementById('modalSubtitle').textContent = '账号只能用英文字母、数字或下划线'; document.getElementById('regCharNameInput').classList.remove('hidden'); document.getElementById('confirmPasswordInput').classList.remove('hidden'); document.getElementById('initialButtons').classList.add('hidden'); document.getElementById('registerButtons').classList.remove('hidden'); document.getElementById('loginError').classList.add('hidden'); }
        function hideRegisterForm() { document.getElementById('modalTitle').textContent = '✨ Starwarts ⚡'; document.getElementById('modalSubtitle').textContent = '登录或注册账号'; document.getElementById('regCharNameInput').classList.add('hidden'); document.getElementById('confirmPasswordInput').classList.add('hidden'); document.getElementById('initialButtons').classList.remove('hidden'); document.getElementById('registerButtons').classList.add('hidden'); document.getElementById('loginError').classList.add('hidden'); }
        async function register() {
            const username = document.getElementById('usernameInput').value.trim();
            const characterName = document.getElementById('regCharNameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;
            if (!username || !password) return showMessage('loginError', '账号和密码不能为空！');
            if (password !== confirmPassword) return showMessage('loginError', '两次输入的密码不一致！');
            try {
                await rpc('sw_register', { p_username: username, p_password: password, p_character_name: characterName || null }, false);
                hideRegisterForm();
                document.getElementById('passwordInput').value = '';
                document.getElementById('confirmPasswordInput').value = '';
                showMessage('loginError', '注册成功！请输入密码登录。', false);
            } catch (error) { showMessage('loginError', error.message); }
        }
        async function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            if (!username || !password) return showMessage('loginError', '账号和密码不能为空！');
            try {
                const result = await rpc('sw_login', { p_username: username, p_password: password }, false);
                if (!result || !result.ok) return showMessage('loginError', (result && result.message) || '登录失败');
                localStorage.setItem(TOKEN_KEY, result.token);
                gameState = result.gameState;
                await enterGame();
            } catch (error) { showMessage('loginError', error.message || '网络错误，无法连接到服务器。'); }
        }
        async function enterGame() {
            document.getElementById('loginRegisterModal').classList.add('hidden');
            document.getElementById('mainContainer').classList.remove('hidden');
            await Promise.all([loadEquipmentStore(), loadMagicCardStore()]);
            buildMainInterface();
            renderAll();
        }
        function logout(skipServer) {
            const token = localStorage.getItem(TOKEN_KEY);
            if (token && !skipServer) rpc('sw_logout').catch(() => { });
            localStorage.removeItem(TOKEN_KEY);
            gameState = {};
            document.getElementById('mainContainer').innerHTML = '';
            document.getElementById('mainContainer').classList.add('hidden');
            document.getElementById('loginRegisterModal').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
            document.getElementById('loginError').classList.add('hidden');
            hideRegisterForm();
        }
        async function refreshState() {
            try { gameState = await rpc('sw_get_state'); renderAll(); }
            catch (error) { handleError('刷新存档失败', error); }
        }

        // ===================== 商店数据 =====================
        async function loadEquipmentStore() { try { globalEquipmentStore = await rpc('sw_list_products', { p_type: 'equipment' }, false) || []; } catch (e) { console.error('加载装备商店失败:', e); globalEquipmentStore = []; } }
        async function loadMagicCardStore() { try { globalMagicCardStore = await rpc('sw_list_products', { p_type: 'card' }, false) || []; } catch (e) { console.error('加载卡牌商店失败:', e); globalMagicCardStore = []; } }

        // ===================== 界面搭建 =====================
        function buildMainInterface() {
            const mainContainer = document.getElementById('mainContainer');
            if (mainContainer.querySelector('#gameContainer')) return;
            mainContainer.innerHTML = `
                <div class="text-center mb-6"><h1 class="text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 floating">✨ Starwarts Magic Academy ⚡</h1><p class="text-gray-300 mt-2">欢迎来到星辰魔法学院</p></div>
                <div class="magic-border mb-6"><div class="magic-card p-4 rounded-lg"><h2 class="text-2xl font-bold text-yellow-300 text-center mb-3"><i class="fas fa-trophy mr-2"></i>战斗力排行榜</h2><div id="leaderboard" class="space-y-2 max-h-48 overflow-y-auto"></div></div></div>
                <div class="magic-border mb-6"><div class="magic-card p-4 rounded-lg"><h2 class="text-2xl font-bold text-yellow-300 text-center mb-3"><i class="fas fa-gem mr-2"></i>星辰财富榜</h2><div id="wealthLeaderboard" class="space-y-2 max-h-48 overflow-y-auto"></div></div></div>
                <div class="flex justify-center space-x-4 mb-6"><button id="navInfoButton" onclick="switchView('info')" class="nav-button active bg-pink-600 text-white font-bold py-2 px-6 rounded-full"><i class="fas fa-user-circle mr-2"></i>巫师信息</button><button id="navExchangeButton" onclick="switchView('exchange')" class="nav-button bg-gray-600 text-white font-bold py-2 px-6 rounded-full"><i class="fas fa-exchange-alt mr-2"></i>交易所</button><button id="navArenaButton" onclick="switchView('arena')" class="nav-button bg-gray-600 text-white font-bold py-2 px-6 rounded-full"><i class="fas fa-khanda mr-2"></i>角斗场</button></div>
                <div id="gameContainer"></div>
                <div id="arenaContainer" class="hidden">
                    <div class="magic-border mb-6"><div class="magic-card p-8 rounded-lg"><div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center text-center"><div class="arena-card p-6 rounded-lg"><h3 id="arenaPlayerName" class="text-2xl font-bold text-blue-300">玩家</h3><div id="arenaPlayerAvatar" class="character-avatar my-4 character-avatar-default-bg"><i class="fas fa-user fa-6x text-white"></i></div><div class="text-left space-y-2"><p class="text-lg"><span class="text-gray-400">战斗力:</span> <span id="arenaPlayerAttack" class="text-red-400 font-bold">0</span></p><p class="text-lg"><span class="text-gray-400">防御力:</span> <span id="arenaPlayerDefense" class="text-blue-400 font-bold">0</span></p></div></div><div class="flex flex-col items-center justify-center space-y-4"><span class="text-7xl font-black text-red-500 floating">VS</span><div><label for="customBetInput" class="block text-sm font-medium text-gray-300 mb-1 text-center">自定义赌注</label><input type="number" id="customBetInput" placeholder="最低100" class="w-36 px-3 py-2 bg-gray-900 text-white text-center rounded border border-purple-500"><p class="text-xs text-gray-500 mt-1">需≥100, 且为100的倍数</p></div><button id="fightButton" onclick="startFight()" class="bg-gradient-to-r from-red-600 to-yellow-500 text-white text-2xl font-bold py-4 px-8 rounded-lg shadow-lg hover:scale-105 transition-transform">战斗吧！</button></div><div id="arenaOpponentCard" class="arena-card p-6 rounded-lg"><h3 id="arenaOpponentName" class="text-2xl font-bold text-red-300">???</h3><div id="arenaOpponentAvatar" class="character-avatar my-4 character-avatar-default-bg"><i class="fas fa-question fa-6x text-white"></i></div><div class="text-left space-y-2"><p class="text-lg"><span class="text-gray-400">战斗力:</span> <span id="arenaOpponentAttack" class="text-red-400 font-bold">?</span></p><p class="text-lg"><span class="text-gray-400">防御力:</span> <span id="arenaOpponentDefense" class="text-blue-400 font-bold">?</span></p></div></div></div></div></div>
                    <div class="magic-border"><div class="magic-card p-6 rounded-lg"><h2 class="text-2xl font-bold text-indigo-300 text-center mb-4"><i class="fas fa-history mr-2"></i>战斗记录</h2><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div><h3 class="text-lg font-bold text-yellow-300 mb-2">胜场排名</h3><div id="winLossRanking" class="space-y-1 max-h-48 overflow-y-auto"></div></div><div><h3 class="text-lg font-bold text-gray-300 mb-2">最近对战</h3><div id="recentBattles" class="space-y-2 max-h-48 overflow-y-auto"></div></div></div></div></div>
                </div>
                <div id="exchangeContainer" class="hidden"><div class="magic-border mb-6"><div class="magic-card p-8 rounded-lg"><div class="flex justify-between items-center mb-6"><h2 class="text-3xl font-bold text-yellow-300 floating"><i class="fas fa-exchange-alt mr-2"></i> 魔法交易所</h2><button onclick="openListItemModal()" class="bg-gradient-to-r from-green-500 to-blue-500 text-white font-bold py-2 px-6 rounded-lg">上架物品</button></div><p class="text-gray-300 text-lg text-center mb-8">一个允许玩家之间自由交易装备与卡牌的神秘市场。</p><div id="exchangeListings" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div></div></div></div>`;
            const gameContainer = document.getElementById('gameContainer');

        // 把本地图片缩小成 160×200 的 JPEG，直接存进数据库（不需要另外的图片服务器）
        function resizeImage(file, width = 160, height = 200) {
            return new Promise((resolve, reject) => {
                if (!file.type.startsWith('image/')) return reject(new Error('请选择图片文件'));
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('读取图片失败'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('无法识别这张图片'));
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        const scale = Math.max(width / img.width, height / img.height);
                        const w = img.width * scale, h = img.height * scale;
                        ctx.drawImage(img, (width - w) / 2, (height - h) / 2, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }
        async function saveCustomization() {
            const newName = document.getElementById('customNameInput').value.trim();
            const newUrl = document.getElementById('customAvatarUrlInput').value.trim();

            const file = fileInput.files[0];
            const saveButton = document.querySelector('#characterCustomizationModal button[onclick="saveCustomization()"]');
            if (newName.length > MAX_NAME_LENGTH) return alert(`角色名不能超过 ${MAX_NAME_LENGTH} 个字。`);
            if (!file && newUrl && !/^https?:\/\//i.test(newUrl)) return alert('头像地址必须以 http:// 或 https:// 开头。');
            saveButton.disabled = true; saveButton.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>正在保存...';
            try {
                let avatar = null;
                if (file) avatar = await resizeImage(file);
                else if (newUrl) avatar = newUrl;
                const data = await rpc('sw_update_profile', { p_character_name: newName || null, p_avatar: avatar });
                gameState = data.gameState;
                renderAll(); closeCustomizationModal(); alert('角色信息已更新！');
            } catch (error) { handleError('保存失败', error); }
            finally { saveButton.disabled = false; saveButton.innerHTML = '保存'; fileInput.value = ''; }
        }

                    const detail = listing.itemType === 'card' ? `<p class="text-xs text-gray-400 mb-1 truncate" title="${esc(listing.description)}">${esc(listing.description)}</p>` : `<p class="text-xs text-gray-400 mb-1">攻 ${num(listing.attack)} · 防 ${num(listing.defense)}</p>`;
                    const img = imgTag(listing.image, listing.name, 'w-full h-full object-cover') || `<i class="fas ${listing.itemType === 'card' ? 'fa-scroll' : 'fa-hat-wizard'} fa-3x text-purple-400"></i>`;
                    return `<div class="magic-card p-4 rounded-lg flex flex-col justify-between"><div><div class="w-full h-40 bg-gray-900 rounded-lg mb-3 flex items-center justify-center overflow-hidden">${img}</div><h4 class="text-white font-bold text-lg truncate">${esc(listing.name)}</h4>${detail}<p class="text-xs text-purple-300 mb-3">由 ${esc(listing.sellerCharacterName)} 出售</p></div><div class="flex justify-between items-center mt-auto"><span class="text-yellow-400 font-bold text-xl">${num(listing.price)} <i class="fas fa-coins text-sm"></i></span>${mine ? `<button onclick="deleteListing(${num(listing.id)})" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-xs">下架</button>` : `<button onclick="purchaseListing(${num(listing.id)})" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-xs">购买</button>`}</div></div>`;
                }).join('');
            } catch (error) { console.error('渲染交易所失败:', error); container.innerHTML = '<p class="text-red-500 text-center col-span-full">无法加载市场数据。</p>'; }
        }
        async function purchaseListing(listingId) {
            const listing = currentListings.find(l => Number(l.id) === Number(listingId));
            if (!confirm(`确定要花 ${listing ? num(listing.price) : ''} 金币购买 "${listing ? listing.name : ''}" 吗？`)) return;
            const data = await act('sw_exchange_buy', { p_listing_id: listingId }, '购买失败');
            if (data) alert('购买成功！');
            renderExchange();
        }
        async function deleteListing(listingId) {
            if (!confirm('确定要下架这个商品吗？物品会退回你的仓库。')) return;
            const data = await act('sw_exchange_cancel', { p_listing_id: listingId }, '下架失败');
            if (data) alert('商品已下架，物品已退回仓库。');
            renderExchange();
        }

        // ===================== 角斗场 =====================
        function renderArenaUI() {
            document.getElementById('arenaPlayerName').textContent = gameState.characterName || '未命名角色';
            setAvatar(document.getElementById('arenaPlayerAvatar'), gameState.characterAvatar, '<i class="fas fa-user fa-6x text-white"></i>');
            document.getElementById('arenaPlayerAttack').textContent = sumStat(gameState.equippedItems, 'attack');
            document.getElementById('arenaPlayerDefense').textContent = sumStat(gameState.equippedItems, 'defense');
            renderBattleHistory();
        }
        async function startFight() {
            const fightButton = document.getElementById('fightButton');
            const betInput = document.getElementById('customBetInput');
            let betAmount = parseInt(betInput.value, 10);
            if (isNaN(betAmount) || !betInput.value) betAmount = 100;
            if (betAmount < 100 || betAmount % 100 !== 0) return alert('赌注必须大于等于100，且为100的倍数！');
            if (num(gameState.playerGold) < betAmount) return alert(`魔法金币不足${betAmount}，无法战斗！`);
            if (!confirm(`战斗需要花费 ${betAmount} 魔法金币，确定要开始吗？`)) return;
            fightButton.disabled = true; fightButton.textContent = '匹配中...';
            resetOpponentCard();
            try {
                const result = await rpc('sw_arena_fight', { p_bet: betAmount });
                gameState = result.gameState; updateStatsUI();
                const opponent = result.opponent || {};
                document.getElementById('arenaOpponentName').textContent = opponent.name || '???';
                setAvatar(document.getElementById('arenaOpponentAvatar'), opponent.avatar, '<i class="fas fa-user-slash fa-6x text-white"></i>');
                document.getElementById('arenaOpponentAttack').textContent = num(opponent.attack);
                document.getElementById('arenaOpponentDefense').textContent = num(opponent.defense);
                setTimeout(() => showBattleResult(result), 1000);
            } catch (error) {
                handleError('战斗失败', error);
                fightButton.disabled = false; fightButton.textContent = '战斗吧！';
            }
        }
        function resetOpponentCard() {
            document.getElementById('arenaOpponentName').textContent = '???';
            setAvatar(document.getElementById('arenaOpponentAvatar'), '', '<i class="fas fa-question fa-6x text-white"></i>');
            document.getElementById('arenaOpponentAttack').textContent = '?';
            document.getElementById('arenaOpponentDefense').textContent = '?';
        }
        function showBattleResult(result) {
            const modal = document.getElementById('battleResultModal');
            const title = document.getElementById('battleResultText');
            title.textContent = result.playerWon ? '胜利!' : '失败!';
            title.className = `text-6xl font-bold mb-4 ${result.playerWon ? 'text-yellow-300' : 'text-red-500'}`;
            document.getElementById('battleResultWinnerName').textContent = result.winnerName || '';
            setAvatar(document.getElementById('battleResultWinnerAvatar'), result.winnerAvatar, '<i class="fas fa-user-astronaut fa-6x text-white"></i>');
            const rewardText = document.getElementById('battleRewardText');
            if (result.playerWon && num(result.rewardAmount) > 0) { rewardText.textContent = `+${num(result.rewardAmount)} 魔法金币`; createConfetti(); }
            else rewardText.textContent = '';
            modal.classList.remove('hidden'); modal.classList.add('flex');
        }
        function closeBattleResultModal() {
            const modal = document.getElementById('battleResultModal');
            modal.classList.add('hidden'); modal.classList.remove('flex');
            const fightButton = document.getElementById('fightButton');
            fightButton.disabled = false; fightButton.textContent = '战斗吧！';
            document.getElementById('confettiContainer').innerHTML = '';
            renderBattleHistory(); updateStatsUI();
        }
        async function renderBattleHistory() {
            const winLossContainer = document.getElementById('winLossRanking');
            const recentContainer = document.getElementById('recentBattles');
            winLossContainer.innerHTML = '<p class="text-gray-500">加载中...</p>';
            recentContainer.innerHTML = '<p class="text-gray-500">加载中...</p>';
            const [rankings, recent] = await Promise.allSettled([rpc('sw_arena_rankings', {}, false), rpc('sw_arena_recent', {}, false)]);
            if (rankings.status === 'fulfilled') {
                const list = rankings.value || [];
                winLossContainer.innerHTML = list.length === 0 ? '<p class="text-gray-500">暂无排名数据</p>'
                    : list.map((p, i) => `<div class="flex justify-between items-center text-gray-300"><div><span class="font-bold text-lg mr-2">${i + 1}.</span><span class="text-purple-300">${esc(p.winner_name)}</span></div><div><span class="text-green-400">${num(p.wins)}胜</span></div></div>`).join('');
            } else winLossContainer.innerHTML = '<p class="text-red-500">加载排名失败</p>';
            if (recent.status === 'fulfilled') {
                const list = recent.value || [];
                recentContainer.innerHTML = list.length === 0 ? '<p class="text-gray-500">暂无对战记录</p>'
                    : list.map(b => `<div class="text-gray-400 text-sm"><span class="font-bold text-green-400">${esc(b.winner_name)}</span> 击败了 <span class="font-bold text-red-400">${esc(b.loser_name)}</span></div>`).join('');
            } else recentContainer.innerHTML = '<p class="text-red-500">加载记录失败</p>';
        }
        function createConfetti() {
            const container = document.getElementById('confettiContainer');
            container.innerHTML = '';
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
